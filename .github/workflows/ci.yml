name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools gettext jq zip
      - name: Check
        run: make check
      - uses: actions/upload-artifact@v4
        with:
          name: plasmoid-package
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plasmoid-package
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/*.plasmoid --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
